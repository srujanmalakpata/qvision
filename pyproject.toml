[project]
name = "qvision"
version = "0.1.0"
description = "Reproducible Fashion-MNIST CNN with a hand-written INT8/INT4 weight quantizer, ONNX export and a FastAPI inference service."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
dependencies = [
    "torch>=2.4,<2.15",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "pillow>=10.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.scripts]
qvision = "qvision.cli:main"

[dependency-groups]
# Needed by `qvision export-onnx` (and its tests) but not to serve the model, so the Docker
# image leaves this group out (`uv sync --no-default-groups`).
export = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "onnxscript>=0.3",
]
dev = [
    "pytest>=8.0",
    "httpx2>=2.0",
    "ruff>=0.6",
    "scikit-learn>=1.4",
    "scipy>=1.11",
]

[tool.uv]
default-groups = ["dev", "export"]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/qvision"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "NPY"]
